version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: report-management-backend/Dockerfile
    container_name: gen_rpt_backend
    restart: always
    ports:
      - "127.0.0.1:9000:8000"
    environment:
      - PORT=8000
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

