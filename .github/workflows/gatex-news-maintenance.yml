name: GateX daily news maintenance

on:
  schedule:
    - cron: '5 0 * * *'
    # Fixed-source recovery only; these events never acquire another source.
    - cron: '5 5,10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Also serialize with the existing manually dispatched warm-news job.
concurrency:
  group: gatex-news-localization
  cancel-in-progress: false

jobs:
  maintain:
    # 08:05 Asia/Shanghai captures once; 13:05 / 18:05 resume the stored pool.
    # This job never calls or changes the digest/email endpoint.
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check 'requests>=2.32.0'
      - name: Warm and verify the complete stored daily Chinese news pool
        env:
          GATEX_NEWSFEED_CRON_SECRET: ${{ secrets.GATEX_NEWSFEED_CRON_SECRET }}
          NEWS_EVENT_NAME: ${{ github.event_name }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
        run: |
          umask 077
          capture_args=()
          if [[ "$NEWS_EVENT_NAME" == "schedule" && "$NEWS_SCHEDULE" == "5 0 * * *" ]]; then
            capture_args+=(--news-capture-daily)
          fi
          PYTHONPATH=. python -u scripts/gatex_localization_runner.py --news-only --news-full-pool "${capture_args[@]}" \
            --news-max-passes 0 \
            --news-budget-seconds 14400 \
            --runtime "$RUNNER_TEMP/gatex-news-localization-private" \
            --summary "$RUNNER_TEMP/gatex-news-localization-qa/summary.json"
      - name: Upload public QA statistics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatex-news-maintenance-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gatex-news-localization-qa/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove private working documents
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/gatex-news-localization-private"
