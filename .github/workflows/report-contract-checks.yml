name: Report contract checks

on:
  pull_request:
    paths:
      - "gen_rpt/**"
      - "report-management-backend/app/**"
      - "tests/**"
      - "tools/run_report_contract_checks.py"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "gen_rpt/**"
      - "report-management-backend/app/**"
      - "tests/**"
      - "tools/run_report_contract_checks.py"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: report-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "SQLAlchemy>=2.0.30,<3"
      - name: Standard, RAG and publication contract regressions
        # No secrets, model/API calls, browser installation or browser launch.
        # The runner rejects network/process attempts, including swallowed ones.
        env:
          REQUIRE_SQLALCHEMY_CONTRACT: "1"
          MPLCONFIGDIR: ${{ runner.temp }}/report-contract-fonts-${{ matrix.python }}
        run: python tools/run_report_contract_checks.py
