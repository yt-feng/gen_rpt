name: Run GateX Newsfeed Digest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatex-newsfeed-digest
  cancel-in-progress: false

jobs:
  dispatch:
    # The next schedule can retry due work; preserve strict manual diagnostics.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due GateX member digests
        env:
          GATEX_NEWSFEED_CRON_SECRET: ${{ secrets.GATEX_NEWSFEED_CRON_SECRET }}
        run: |
          test -n "$GATEX_NEWSFEED_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $GATEX_NEWSFEED_CRON_SECRET" \
            https://gatex.fund/api/newsfeed/digest/run
      - name: Record actual digest outcome
        if: always()
        env:
          TASK_STATUS: ${{ job.status }}
        run: |
          {
            printf '### Digest receipt\n\n- Job outcome: `%s`\n' "$TASK_STATUS"
            printf '\nScheduled runs are best effort. The endpoint response records delivery results; a failed request is not a successful digest and remains visible in the original step.\n'
          } >> "$GITHUB_STEP_SUMMARY"
