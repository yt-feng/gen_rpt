name: "[BULK] Generate HTML Thought Leadership Report + AI Review"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: English thought-leadership topic.
        required: true
        type: string
      slug:
        description: Required unique output directory slug (must be unique per report).
        required: true
        type: string
      model:
        description: DeepSeek model name
        required: false
        default: deepseek-chat
        type: string

permissions:
  contents: read
  actions: write

# KEY CHANGE: scoped per-slug so simultaneous reports never block each other.
concurrency:
  group: bulk-gen-${{ inputs.slug || github.run_id }}
  cancel-in-progress: false

jobs:
  generate-and-review-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Generation Config
      GEN_RPT_PER_QUERY: 5
      GEN_RPT_MAX_SOURCES: 32
      GEN_RPT_MAX_QUERIES: 24
      GEN_RPT_GDELT_QUERIES: 2
      GEN_RPT_GDELT_TIMESPAN: 36months
      GEN_RPT_FETCH_TIMEOUT: 18
      MAX_AI_SECTION_IMAGES: 12
      AI_IMAGE_TIMEOUT: 45
      AI_IMAGE_RETRIES: 3
      SHOW_FALLBACK_IMAGES: true
      TOPIC_INPUT: ${{ inputs.topic }}
      SLUG_INPUT: ${{ inputs.slug }}
      MODEL_INPUT: ${{ inputs.model || 'deepseek-chat' }}
      
      # Review Config
      REVIEW_MODEL: llama-3.3-70b-versatile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Generation + Review)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r review_system/requirements.txt

      - name: Validate API keys
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Missing DEEPSEEK_API_KEY secret" >&2
            exit 1
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Missing GROQ_API_KEY secret" >&2
            exit 1
          fi

      # ---------------------------------------------------------
      # PHASE 1: GENERATION
      # ---------------------------------------------------------
      - name: Generate report
        id: generate_report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          TOPIC="$TOPIC_INPUT"
          SLUG="$SLUG_INPUT"
          MODEL="$MODEL_INPUT"

          # IMPORTANT FIX: Delete any existing reports_web folder that was checked out 
          # from the git repo, so `find` below only matches the newly generated report.
          rm -rf reports_web
          mkdir -p reports_web
          GEN_LOG="reports_web/generation-${GITHUB_RUN_ID:-local}.log"
          
          # Run the generation script — capture exit code rather than letting
          # set -e kill the step. The script sometimes exits non-zero even
          # after a successful report (soft warning at cleanup), so we validate
          # success by checking for the actual output files instead.
          set +e
          python -u -m gen_rpt.main_web \
            --topic "$TOPIC" \
            --slug "$SLUG" \
            --language en \
            --model "$MODEL" \
            --out-root reports_web > "$GEN_LOG" 2>&1
          GEN_EXIT=$?
          set -e

          # Always print the log so the step output is visible
          cat "$GEN_LOG" || true

          # Validate success by checking that the report files actually exist
          REPORT_MD="$(find reports_web -maxdepth 3 -name "report.md" | sort -r | head -1 || true)"
          if [ -z "$REPORT_MD" ]; then
            echo "::error::Generation failed — report.md not found. Generation exit code: $GEN_EXIT" >&2
            exit 1
          fi

          REPORT_DIR="$(dirname "$REPORT_MD")"
          REPORT_ID="$(basename "$REPORT_DIR")"

          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
          echo "report_id=$REPORT_ID"   >> "$GITHUB_OUTPUT"
          echo "document_id=$SLUG"      >> "$GITHUB_OUTPUT"
          echo "Generation succeeded. Report dir: $REPORT_DIR"

      # NOTE: No Git Commit Step here. Makes workflow stateless & concurrent.

      # ---------------------------------------------------------
      # PHASE 2: AI REVIEW
      # ---------------------------------------------------------
      - name: Run AI review pipeline
        id: run_review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          REPORT_PATH="$REPORT_DIR/report.md"
          OUTPUT_DIR="review_outputs/$REPORT_ID"
          
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          python review_system/main.py \
            --report  "$REPORT_PATH" \
            --output  "$OUTPUT_DIR" \
            --model   "$REVIEW_MODEL"

      - name: Verify review outputs
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ steps.run_review.outputs.output_dir }}"
          EXPECTED=(review.md review.json review.html claims.json findings.json scores.json)
          MISSING=()

          for f in "${EXPECTED[@]}"; do
            if [ ! -f "$OUTPUT_DIR/$f" ]; then
              MISSING+=("$f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing mandatory review output files: ${MISSING[*]}" >&2
            exit 1
          fi

      - name: Write review_status.json
        if: always()
        run: |
          OUTPUT_DIR="review_outputs/${{ steps.generate_report.outputs.report_id }}"
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          STATUS="${{ steps.run_review.outcome }}"   

          mkdir -p "$OUTPUT_DIR"

          python - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          output_dir = os.environ.get("OUTPUT_DIR", "review_outputs/unknown")
          report_id  = os.environ.get("REPORT_ID", "unknown")
          status     = os.environ.get("STATUS", "unknown")

          payload = {
              "report_id":      report_id,
              "review_status":  status,
              "timestamp_utc":  datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "model":          os.environ.get("REVIEW_MODEL", "llama-3.3-70b-versatile"),
              "bulk":           True
          }
          out_path = os.path.join(output_dir, "review_status.json")
          os.makedirs(output_dir, exist_ok=True)
          with open(out_path, "w") as f:
              json.dump(payload, f, indent=2)
          print(f"review_status.json written to {out_path}")
          PYEOF
        env:
          OUTPUT_DIR: review_outputs/${{ steps.generate_report.outputs.report_id }}
          REPORT_ID:  ${{ steps.generate_report.outputs.report_id }}
          STATUS:     ${{ steps.run_review.outcome }}

      # ---------------------------------------------------------
      # PHASE 3: UPLOAD TO R2 & TRIGGER WEBHOOKS
      # ---------------------------------------------------------
      - name: Check R2 secrets
        id: check_r2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "has_r2_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_r2_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install R2 storage dependencies
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        run: |
          pip install -r storage/requirements.txt

      - name: Upload GENERATED REPORT to R2
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          python -m storage.upload_report \
            --report-dir "$REPORT_DIR" \
            --status generated \
            --log-level INFO \
            --skip-catalog-update

      - name: Trigger Backend Report Webhook
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret missing, skipping webhook"
            exit 0
          fi
          
          curl -X POST "$BACKEND_URL/api/internal/events/report-generated" \
               -H "Content-Type: application/json" \
               -H "x-internal-token: $INTERNAL_TOKEN" \
               -d '{
                 "document_id": "${{ inputs.slug }}",
                 "idempotency_key": "github-actions-bulk-${{ github.run_id }}-${{ github.run_attempt }}",
                 "metadata": {
                   "run_id": "${{ github.run_id }}",
                   "slug": "${{ inputs.slug }}",
                   "bulk": true
                 }
               }'

      - name: Upload REVIEW to R2
        if: steps.check_r2.outputs.has_r2_secrets == 'true' && steps.run_review.outcome == 'success'
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          OUTPUT_DIR="review_outputs/$REPORT_ID"
          python -m storage.upload_review \
            --review-dir "$OUTPUT_DIR" \
            --report-id  "$REPORT_ID" \
            --log-level  INFO

      - name: Trigger Backend Review Webhook
        if: steps.run_review.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret missing, skipping webhook"
            exit 0
          fi
          
          curl -X POST "$BACKEND_URL/api/internal/events/review-generated" \
               -H "Content-Type: application/json" \
               -H "x-internal-token: $INTERNAL_TOKEN" \
               -d '{
                 "document_id": "${{ steps.generate_report.outputs.report_id }}",
                 "idempotency_key": "github-actions-bulk-review-${{ github.run_id }}-${{ github.run_attempt }}",
                 "metadata": {
                   "run_id": "${{ github.run_id }}",
                   "bulk": true
                 }
               }'
