name: "[BULK] Generate HTML Thought Leadership Report + AI Review"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: English thought-leadership topic.
        required: true
        type: string
      slug:
        description: Required unique output directory slug (must be unique per report).
        required: true
        type: string
      rag_required:
        description: Require the validated private context prepared for this job.
        required: false
        default: true
        type: boolean
      model:
        description: DeepSeek model name
        required: false
        default: deepseek-chat
        type: string
      content_policy:
        description: Produce a disclosed general overview when private evidence or research quality is unavailable
        required: false
        default: seo_overview
        type: choice
        options: [seo_overview, strict]
      job_id:
        description: Original backend job ID (empty for standalone generation)
        required: false
        default: ""
        type: string
      job_retry_count:
        description: Original backend attempt counter
        required: false
        default: ""
        type: string
      context_state:
        description: Backend context readiness; overview_only never reads stale cached context
        required: false
        default: unknown
        type: string

permissions:
  contents: read
  actions: write

# KEY CHANGE: scoped per-slug so simultaneous reports never block each other.
concurrency:
  group: bulk-gen-${{ inputs.slug || github.run_id }}
  cancel-in-progress: false

jobs:
  generate-and-review-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Generation Config
      GEN_RPT_PER_QUERY: 5
      GEN_RPT_MAX_SOURCES: 32
      GEN_RPT_MAX_QUERIES: 24
      GEN_RPT_GDELT_QUERIES: 2
      GEN_RPT_GDELT_TIMESPAN: 36months
      GEN_RPT_FETCH_TIMEOUT: 18
      GEN_RPT_RAG_WEB_MAX_QUERIES: 4
      GEN_RPT_RAG_WEB_PER_QUERY: 2
      GEN_RPT_RAG_WEB_MAX_SOURCES: 8
      GEN_RPT_RAG_WEB_REQUIRED: false
      MAX_AI_SECTION_IMAGES: 12
      AI_IMAGE_TIMEOUT: 45
      AI_IMAGE_RETRIES: 3
      SHOW_FALLBACK_IMAGES: true
      TOPIC_INPUT: ${{ inputs.topic }}
      SLUG_INPUT: ${{ inputs.slug }}
      RAG_REQUIRED: ${{ inputs.rag_required }}
      MODEL_INPUT: ${{ inputs.model || 'deepseek-chat' }}
      CONTENT_POLICY: ${{ inputs.content_policy || 'seo_overview' }}
      GENERATION_JOB_ID: ${{ inputs.job_id || '' }}
      GENERATION_JOB_RETRY_COUNT: ${{ inputs.job_retry_count || '' }}
      RESULT_PATH: .artifacts/report-generation/result.json
      GENERATION_CONTEXT_STATE: ${{ inputs.context_state || 'unknown' }}
      
      # Review Config
      REVIEW_MODEL: llama-3.3-70b-versatile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Generation + Review)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r review_system/requirements.txt

      # ---------------------------------------------------------
      # PHASE 1: GENERATION
      # ---------------------------------------------------------
      - name: Generate report
        id: generate_report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SEARXNG_URL: ${{ vars.SEARXNG_URL || secrets.SEARXNG_URL }}
          SEARXNG_API_KEY: ${{ secrets.SEARXNG_API_KEY }}
        run: |
          TOPIC="$TOPIC_INPUT"
          SLUG="$SLUG_INPUT"
          MODEL="$MODEL_INPUT"

          mkdir -p .artifacts/report-generation
          GEN_LOG=".artifacts/report-generation/generation-${GITHUB_RUN_ID:-local}.log"
          set +e
          python -u -m gen_rpt.main_web \
            --topic "$TOPIC" \
            --slug "$SLUG" \
            --language en \
            --model "$MODEL" \
            --out-root reports_web \
            --content-policy "$CONTENT_POLICY" \
            --result-path "$RESULT_PATH" > "$GEN_LOG" 2>&1
          GEN_EXIT=$?
          set -e

          # Always print the log so the step output is visible
          cat "$GEN_LOG" || true

          if [ "$GEN_EXIT" -ne 0 ]; then
            echo "::error::Generator failed with exit code $GEN_EXIT" >&2
            exit "$GEN_EXIT"
          fi
          test -s "$RESULT_PATH"


      - name: Run AI review pipeline
        if: steps.generate_report.outputs.status == 'generated' && inputs.content_policy == 'strict'
        id: run_review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: meta-llama/llama-3.3-70b-instruct
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          REPORT_PATH="$REPORT_DIR/report.md"
          OUTPUT_DIR="review_outputs/$REPORT_ID"
          
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          python review_system/main.py \
            --report  "$REPORT_PATH" \
            --output  "$OUTPUT_DIR" \
            --model   "$REVIEW_MODEL"

      - name: Verify review outputs
        if: steps.run_review.outcome == 'success'
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ steps.run_review.outputs.output_dir }}"
          EXPECTED=(review.md review.json review.html claims.json findings.json scores.json)
          MISSING=()

          for f in "${EXPECTED[@]}"; do
            if [ ! -f "$OUTPUT_DIR/$f" ]; then
              MISSING+=("$f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing mandatory review output files: ${MISSING[*]}" >&2
            exit 1
          fi

      - name: Write review_status.json
        if: always()
        run: |
          OUTPUT_DIR="review_outputs/${{ steps.generate_report.outputs.report_id }}"
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          STATUS="${{ steps.run_review.outcome }}"   

          mkdir -p "$OUTPUT_DIR"

          python - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          output_dir = os.environ.get("OUTPUT_DIR", "review_outputs/unknown")
          report_id  = os.environ.get("REPORT_ID", "unknown")
          status     = os.environ.get("STATUS", "unknown")

          payload = {
              "report_id":      report_id,
              "review_status":  status,
              "timestamp_utc":  datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "model":          os.environ.get("REVIEW_MODEL", "llama-3.3-70b-versatile"),
              "bulk":           True
          }
          out_path = os.path.join(output_dir, "review_status.json")
          os.makedirs(output_dir, exist_ok=True)
          with open(out_path, "w") as f:
              json.dump(payload, f, indent=2)
          print(f"review_status.json written to {out_path}")
          PYEOF
        env:
          OUTPUT_DIR: review_outputs/${{ steps.generate_report.outputs.report_id }}
          REPORT_ID:  ${{ steps.generate_report.outputs.report_id }}
          STATUS:     ${{ steps.run_review.outcome }}

      # ---------------------------------------------------------
      # PHASE 3: UPLOAD TO R2 & TRIGGER WEBHOOKS
      # ---------------------------------------------------------
      - name: Check R2 secrets
        id: check_r2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "has_r2_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_r2_secrets=false" >> "$GITHUB_OUTPUT"
            if [ -n "$GENERATION_JOB_ID" ]; then
              echo "Backend job output requires configured R2 storage" >&2
              exit 1
            fi
          fi

      - name: Install R2 storage dependencies
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        run: |
          pip install -r storage/requirements.txt

      - name: Upload GENERATED REPORT to R2
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          python -m storage.upload_report \
            --report-dir "$REPORT_DIR" \
            --status generated \
            --log-level INFO \
            --skip-catalog-update

      - name: Trigger Backend Report Webhook
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python tools/notify_generation_result.py --receipt "$RESULT_PATH"

      - name: Preserve structured generation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-generation-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/report-generation/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload REVIEW to R2
        if: steps.check_r2.outputs.has_r2_secrets == 'true' && steps.run_review.outcome == 'success'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_ID="${{ steps.generate_report.outputs.report_id }}"
          OUTPUT_DIR="review_outputs/$REPORT_ID"
          python -m storage.upload_review \
            --review-dir "$OUTPUT_DIR" \
            --report-id  "$REPORT_ID" \
            --log-level  INFO

      - name: Trigger Backend Review Webhook
        if: steps.run_review.outcome == 'success'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret missing, skipping webhook"
            exit 0
          fi
          
          curl --fail-with-body --show-error -i -X POST "$BACKEND_URL/api/internal/events/review-generated" \
               -H "Content-Type: application/json" \
               -H "x-internal-token: $INTERNAL_TOKEN" \
               -d '{
                 "document_id": "${{ inputs.slug }}",
                 "idempotency_key": "github-actions-bulk-review-${{ github.run_id }}-${{ github.run_attempt }}",
                 "metadata": {
                   "run_id": "${{ github.run_id }}",
                   "bulk": true
                 }
               }'

      - name: Trigger Backend Failure Webhook
        if: failure()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python tools/notify_generation_result.py --failure --slug "$SLUG_INPUT"
