name: Generate HTML Thought Leadership Report

on:
  workflow_dispatch:
    inputs:
      topic:
        description: English thought-leadership topic.
        required: false
        default: Nuclear fusion commercialization outlook and strategic implications
        type: string
      slug:
        description: Optional custom output directory slug
        required: false
        default: ""
        type: string
      model:
        description: DeepSeek model name
        required: false
        default: deepseek-chat
        type: string
      job_id:
        description: Optional GateX generation job UUID. Leave empty for the original manual workflow.
        required: false
        default: ""
        type: string
      language:
        description: Report language
        required: false
        default: en
        type: choice
        options:
          - en
          - zh
      source_mode:
        description: Source policy used by a GateX generation job
        required: false
        default: web_only
        type: choice
        options:
          - web_only
          - collection_only
          - web_and_collection
      report_mode:
        description: GateX report production format
        required: false
        default: standard_v1
        type: choice
        options:
          - standard_v1
          - gatex_simplified_v1
      callback_base:
        description: GateX callback origin used only when job_id is set
        required: false
        default: https://gatex.fund
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: gen-rpt-${{ inputs.job_id || github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEN_RPT_PER_QUERY: 5
      GEN_RPT_MAX_SOURCES: 32
      GEN_RPT_MAX_QUERIES: 24
      GEN_RPT_GDELT_QUERIES: 2
      GEN_RPT_GDELT_TIMESPAN: 36months
      GEN_RPT_FETCH_TIMEOUT: 18
      MAX_AI_SECTION_IMAGES: 12
      AI_IMAGE_TIMEOUT: 45
      AI_IMAGE_RETRIES: 3
      SHOW_FALLBACK_IMAGES: true
      TOPIC_INPUT: ${{ inputs.topic || '' }}
      SLUG_INPUT: ${{ inputs.slug || '' }}
      MODEL_INPUT: ${{ inputs.model || '' }}
      JOB_ID_INPUT: ${{ inputs.job_id || '' }}
      LANGUAGE_INPUT: ${{ inputs.language || 'en' }}
      SOURCE_MODE_INPUT: ${{ inputs.source_mode || 'web_only' }}
      REPORT_MODE_INPUT: ${{ inputs.report_mode || 'standard_v1' }}
      CALLBACK_BASE_INPUT: ${{ inputs.callback_base || 'https://gatex.fund' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print run estimates
        run: |
          echo "Expected step timings for this workflow:"
          echo "- Checkout: 15-45s, slower when generated report artifacts make the repo large."
          echo "- Setup Python: 5-20s."
          echo "- Python syntax check: <10s."
          echo "- Install dependencies: 20-90s on a warm network, up to 3m on a cold runner."
          echo "- HTML smoke test: 5-20s."
          echo "- Secret validation: <5s."
          echo "- Generate report: 4-10m typical; up to 20-35m if external search, DeepSeek, or image retries are slow."
          echo "- Audit generated report: <10s."
          echo "- Commit and push generated report: 5-60s depending on artifact size and remote contention."

      - name: Python syntax check
        run: |
          echo "[estimate] Python syntax check should finish in <10s."
          python -m compileall -q gen_rpt tests tools

      - name: Install dependencies
        run: |
          echo "[estimate] Dependency install usually takes 20-90s; cold runners can take up to 3m."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "$JOB_ID_INPUT" ] && [ -n "$GROQ_API_KEY" ]; then
            pip install -r review_system/requirements.txt
          fi
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run HTML smoke test
        env:
          DISABLE_AI_IMAGES: true
        run: |
          echo "[estimate] HTML smoke test should finish in 5-20s."
          python tests/smoke_test_web_report.py

      - name: Validate secret
        if: ${{ env.JOB_ID_INPUT == '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "[estimate] Secret validation should finish in <5s."
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Missing DEEPSEEK_API_KEY secret" >&2
            exit 1
          fi

      - name: Run GateX generation bridge
        if: ${{ env.JOB_ID_INPUT != '' }}
        id: gatex_bridge
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARXNG_URL: ${{ vars.SEARXNG_URL || secrets.SEARXNG_URL }}
          SEARXNG_API_KEY: ${{ secrets.SEARXNG_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GATEX_GENERATION_CALLBACK_SECRET: ${{ secrets.GATEX_GENERATION_CALLBACK_SECRET }}
          GATEX_GENERATION_CALLBACK_ALLOWED_HOSTS: gatex.fund,www.gatex.fund
          REVIEW_MODEL: llama-3.3-70b-versatile
        run: |
          set -euo pipefail
          python -u tools/gatex_generation_bridge.py run \
            --job-id "$JOB_ID_INPUT" \
            --topic "$TOPIC_INPUT" \
            --slug "$SLUG_INPUT" \
            --language "$LANGUAGE_INPUT" \
            --source-mode "$SOURCE_MODE_INPUT" \
            --report-mode "$REPORT_MODE_INPUT" \
            --callback-base "$CALLBACK_BASE_INPUT" \
            --model "${MODEL_INPUT:-deepseek-chat}" \
            --out-root reports_web/gatex_jobs

      - name: Generate report
        if: ${{ env.JOB_ID_INPUT == '' }}
        id: generate_report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          echo "[estimate] Generate report usually takes 4-10m; upper bound is 20-35m when external APIs retry."
          TOPIC="$TOPIC_INPUT"
          SLUG="$SLUG_INPUT"
          MODEL="$MODEL_INPUT"

          if [ -z "$TOPIC" ]; then
            TOPIC="Nuclear fusion commercialization outlook and strategic implications"
          fi
          if [ -z "$MODEL" ]; then
            MODEL="deepseek-chat"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -z "$SLUG" ]; then
            SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
            SLUG="auto-smoke-nuclear-fusion-${SHORT_SHA}"
          fi

          mkdir -p reports_web
          GEN_LOG="reports_web/generation-${GITHUB_RUN_ID:-local}.log"
          START_TS="$(date +%s)"
          echo "Generation context:"
          echo "- topic: $TOPIC"
          echo "- slug: ${SLUG:-<auto>}"
          echo "- model: $MODEL"
          echo "- log: $GEN_LOG"
          echo "- heartbeat: every 15s until python exits"

          python -u -m gen_rpt.main_web \
            --topic "$TOPIC" \
            --slug "$SLUG" \
            --language "$LANGUAGE_INPUT" \
            --model "$MODEL" \
            --out-root reports_web > "$GEN_LOG" 2>&1 &
          GEN_PID="$!"

          while kill -0 "$GEN_PID" 2>/dev/null; do
            sleep 15
            NOW_TS="$(date +%s)"
            ELAPSED="$((NOW_TS - START_TS))"
            echo "[heartbeat] Generate report still running | elapsed=${ELAPSED}s | typical=4-10m | slow_external_api_upper=20-35m"
            if [ -s "$GEN_LOG" ]; then
              echo "[heartbeat] Last generator log lines:"
              tail -n 20 "$GEN_LOG"
            else
              echo "[heartbeat] Generator log file is still empty; likely waiting on first external API call."
            fi
          done

          set +e
          wait "$GEN_PID"
          GEN_STATUS="$?"
          set -e

          echo "::group::Full generator log"
          if [ -f "$GEN_LOG" ]; then
            cat "$GEN_LOG"
          else
            echo "Generator log file was not created."
          fi
          echo "::endgroup::"

          if [ "$GEN_STATUS" -ne 0 ]; then
            echo "Generator failed with exit code $GEN_STATUS" >&2
            exit "$GEN_STATUS"
          fi

          REPORT_DIR="$(find reports_web -maxdepth 1 -type d -name "$(date -u +%F)-*" -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$REPORT_DIR" ]; then
            echo "Could not locate generated report directory" >&2
            exit 1
          fi
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"

      - name: Audit generated report
        if: ${{ env.JOB_ID_INPUT == '' }}
        run: |
          echo "[estimate] Audit should finish in <10s."
          python tools/local_web_report_audit.py "${{ steps.generate_report.outputs.report_dir }}"

      - name: Commit generated report back to repo
        if: ${{ env.JOB_ID_INPUT == '' }}
        run: |
          set -euo pipefail
          echo "[estimate] Commit and push usually takes 5-60s depending on artifact size and remote contention."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain reports_web)" ]; then
            git add reports_web
            if [ -d "review_outputs" ]; then git add review_outputs; fi
            git commit -m "Add generated HTML thought leadership report"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No report changes to commit"
          fi

      # ── R2: Check secrets are configured ──────────────────────────────────
      # NOTE: GitHub Actions does not expose secret values in if: expressions
      # via env.*. The only reliable pattern is a dedicated step that reads
      # the secret and sets an output flag, then subsequent steps gate on that.
      - name: Check R2 secrets
        id: check_r2
        if: ${{ env.JOB_ID_INPUT == '' }}
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "has_r2_secrets=true" >> "$GITHUB_OUTPUT"
            echo "R2 secrets are configured — upload steps will run."
          else
            echo "has_r2_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::R2 secrets not configured — upload steps will be skipped."
          fi

      # ── R2: Install storage dependencies ──────────────────────────────────
      - name: Install R2 storage dependencies
        if: ${{ env.JOB_ID_INPUT == '' && steps.check_r2.outputs.has_r2_secrets == 'true' }}
        run: |
          pip install -r storage/requirements.txt

      # ── R2: Upload report ──────────────────────────────────────────────────
      - name: Upload report to R2
        if: ${{ env.JOB_ID_INPUT == '' && steps.check_r2.outputs.has_r2_secrets == 'true' }}
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          if [ -z "$REPORT_DIR" ]; then
            echo "::error::[STAGE: REPORT_UPLOAD_FAILED] No report directory found — aborting upload." >&2
            exit 1
          fi
          START_TIME=$(date +%s)
          REPORT_ID=$(basename "$REPORT_DIR")
          echo "[STAGE: REPORT_UPLOAD_START] Report ID: $REPORT_ID | Directory: $REPORT_DIR"
          python -m storage.upload_report \
            --report-dir "$REPORT_DIR" \
            --status generated \
            --log-level INFO
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "[STAGE: REPORT_UPLOAD_SUCCESS] Report ID: $REPORT_ID | Elapsed: ${ELAPSED}s"

      # ── R2: Upload storage logs as artifact ──────────────────────────────────
      - name: Upload R2 storage logs
        if: ${{ always() && env.JOB_ID_INPUT == '' && steps.check_r2.outputs.has_r2_secrets == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-storage-logs-report
          path: /tmp/storage-logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify GateX if the workflow stopped before completion
        if: ${{ failure() && env.JOB_ID_INPUT != '' && steps.gatex_bridge.outputs.gatex_completed != 'true' && steps.gatex_bridge.outputs.gatex_failure_notified != 'true' }}
        env:
          GATEX_GENERATION_CALLBACK_SECRET: ${{ secrets.GATEX_GENERATION_CALLBACK_SECRET }}
        run: |
          python3 - <<'PY' || true
          import json
          import os
          import time
          import uuid
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          job_id = str(uuid.UUID(os.environ["JOB_ID_INPUT"]))
          callback_base = os.environ["CALLBACK_BASE_INPUT"].strip().rstrip("/")
          parsed = urlparse(callback_base)
          try:
              port = parsed.port
          except ValueError as exc:
              raise ValueError("GateX callback origin contains an invalid port.") from exc
          if (
              parsed.scheme != "https"
              or parsed.hostname not in {"gatex.fund", "www.gatex.fund"}
              or parsed.username is not None
              or parsed.password is not None
              or port not in {None, 443}
              or parsed.path not in {"", "/"}
              or parsed.params
              or parsed.query
              or parsed.fragment
          ):
              raise ValueError("GateX callback origin is not allowed.")
          callback_base = f"https://{parsed.hostname}"
          token = os.environ.get("GATEX_GENERATION_CALLBACK_SECRET", "").strip()
          if not token:
              raise ValueError("GATEX_GENERATION_CALLBACK_SECRET is missing.")
          body = json.dumps(
              {
                  "phase": "failed",
                  "error": "The GitHub Actions workflow stopped before the GateX bridge completed.",
                  "message": "The GateX generation workflow stopped before completion.",
                  "workflowRunId": os.environ.get("GITHUB_RUN_ID", ""),
              }
          ).encode("utf-8")
          endpoint = f"{callback_base}/api/generation/jobs/{job_id}/fail"
          last_error = None
          for attempt in range(4):
              request = Request(
                  endpoint,
                  data=body,
                  method="POST",
                  headers={
                      "authorization": f"Bearer {token}",
                      "content-type": "application/json",
                      "user-agent": "GateX-GenRPT-Bridge/1.0",
                  },
              )
              try:
                  with urlopen(request, timeout=45) as response:
                      if 200 <= response.status < 300:
                          break
              except HTTPError as exc:
                  last_error = exc
                  if exc.code < 500 and exc.code != 429:
                      raise
              except URLError as exc:
                  last_error = exc
              if attempt == 3:
                  raise RuntimeError(f"GateX fail callback was not accepted: {last_error}")
              time.sleep(2**attempt)
          PY
