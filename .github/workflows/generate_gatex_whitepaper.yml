name: Generate GateX White Paper

on:
  workflow_dispatch:
    inputs:
      title:
        description: Approved GateX publication title
        required: true
        default: "Red Chips: China Technology and Capital Markets Outlook"
        type: string
      topic:
        description: Research question and scope
        required: true
        default: "China technology and capital-markets outlook for 2026, with evidence on semiconductors, AI infrastructure, robotics, optical components, public-market access and cross-border capital relevance. Prioritise official statistics, exchange publications, company filings and filetype:pdf sources."
        type: string
      slug:
        description: Stable output slug
        required: true
        default: "red-chips-china-technology-capital-markets"
        type: string
      brief:
        description: Additional editorial boundary
        required: false
        default: "Build an evidence-led China technology watch for senior investors and operators. Distinguish industrial capability, capital-market access and execution constraints. Use Gulf relevance only where the evidence supports it."
        type: string
      model:
        description: DeepSeek editorial model
        required: false
        default: "deepseek-v4-pro"
        type: string
      resume_run_id:
        description: Optional prior workflow run ID whose review artifact should be resumed
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ vars.GATEX_REPORT_CONCURRENCY_ENABLED == 'true' && format('gatex-whitepaper-{0}', inputs.slug) || 'gatex-whitepaper-production-serial' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      QWEN_VL_API_KEY: ${{ secrets.QWEN_VL_API_KEY }}
      QWEN_VL_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      QWEN_VL_MODEL: qwen3-vl-flash
      GATEX_REQUIRE_SEMANTIC_VISUAL_QA: "true"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      GATEX_OPENALEX_MAX_QUERIES: "3"
      GATEX_OPENALEX_PER_QUERY: "8"
      GATEX_OPENALEX_MAX_SOURCES: "6"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_THINKING: disabled
      DEEPSEEK_MAX_TOKENS: "16000"
      GATEX_EDITORIAL_FALLBACK_MODEL: ""
      GATEX_RESEARCH_MODEL: deepseek-v4-pro
      APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
      APIMART_IMAGE_MODEL: gpt-image-2
      GEN_RPT_PER_QUERY: "4"
      GEN_RPT_MAX_SOURCES: "30"
      GEN_RPT_MAX_QUERIES: "18"
      GEN_RPT_GDELT_QUERIES: "2"
      GEN_RPT_GDELT_TIMESPAN: "36months"
      GEN_RPT_FETCH_TIMEOUT: "24"
      GATEX_IMAGE_WORKERS: "3"
      GATEX_IMAGE_PROVIDER: apimart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
          python -m playwright install --with-deps chromium

      - name: Validate cloud configuration
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY" >&2; exit 1; }
          test -n "$APIMART_API_KEY" || { echo "Missing APIMART_API_KEY for image generation" >&2; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "Missing TAVILY_API_KEY" >&2; exit 1; }
          test -n "$QWEN_VL_API_KEY" || { echo "Missing QWEN_VL_API_KEY" >&2; exit 1; }
          test -n "$OPENALEX_API_KEY" || echo "OpenAlex academic supplement is not configured; continuing with primary public sources."
          python -m py_compile \
            gen_rpt/deepseek_client.py \
            gen_rpt/openalex_fetch.py \
            gen_rpt/web_fetch.py \
            gen_rpt/gatex_pdf_renderer.py \
            gen_rpt/gatex_whitepaper_pipeline.py \
            tools/generate_gatex_whitepaper.py

      - name: Verify publication quality gates
        run: |
          python -m pytest -q \
            tests/test_gatex_pdf_renderer.py \
            tests/test_gatex_whitepaper_pipeline.py

      - name: Verify DeepSeek editorial route
        run: |
          python - <<'PY'
          from gen_rpt.deepseek_client import DeepSeekClient

          client = DeepSeekClient(model="${{ inputs.model }}", timeout=420)
          result = client.chat_json(
              [
                  {
                      "role": "system",
                      "content": "Return valid JSON only.",
                  },
                  {
                      "role": "user",
                      "content": 'Return exactly {"status":"ready"}.',
                  },
              ],
              temperature=0.0,
              max_tokens=1_000,
          )
          if result.get("status") != "ready":
              raise SystemExit(f"Unexpected DeepSeek editorial canary: {result}")
          print("DeepSeek editorial route ready: ${{ inputs.model }}")
          PY

      - name: Restore prior cloud checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          pattern: gatex-review-${{ inputs.slug }}-*
          path: output/gatex-whitepapers
          merge-multiple: true

      - name: Restore research checkpoint
        id: research_cache
        uses: actions/cache/restore@v4
        with:
          path: output/gatex-whitepapers/${{ inputs.slug }}/research
          key: gatex-research-${{ inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            gatex-research-${{ inputs.slug }}-

      - name: Generate review-gated GateX PDF
        id: generate
        run: |
          set -euo pipefail
          mkdir -p output/gatex-whitepapers
          python -u tools/generate_gatex_whitepaper.py \
            --title "${{ inputs.title }}" \
            --topic "${{ inputs.topic }}" \
            --slug "${{ inputs.slug }}" \
            --brief "${{ inputs.brief }}" \
            --model "${{ inputs.model }}" \
            --out-root output/gatex-whitepapers \
            2>&1 | tee output/gatex-whitepapers/cloud-generation.log

      - name: Upload human-review package
        if: ${{ always() }}
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatex-review-${{ inputs.slug }}-${{ github.run_number }}
          path: |
            output/gatex-whitepapers/${{ inputs.slug }}/
            output/gatex-whitepapers/cloud-generation.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Save research checkpoint
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: output/gatex-whitepapers/${{ inputs.slug }}/research
          key: gatex-research-${{ inputs.slug }}-${{ github.run_id }}

      - name: Save editorial checkpoint
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: output/gatex-whitepapers/${{ inputs.slug }}/editorial-*.json
          key: gatex-editorial-${{ inputs.slug }}-${{ github.run_id }}

      - name: Publish review summary
        if: ${{ always() }}
        run: |
          {
            echo "## GateX cloud report"
            echo
            echo "- Title: ${{ inputs.title }}"
            echo "- Slug: \`${{ inputs.slug }}\`"
            echo "- Publication state: awaiting human review"
            echo "- Automatic publication: disabled"
            echo "- Resumed run: ${{ inputs.resume_run_id || 'none' }}"
            echo "- Report-level concurrency flag: ${{ vars.GATEX_REPORT_CONCURRENCY_ENABLED || 'false' }}"
            echo "- Review package: ${{ steps.artifact.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
