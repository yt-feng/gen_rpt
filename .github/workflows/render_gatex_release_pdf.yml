name: Render approved GateX PDF release

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: GateX report review item UUID
        required: true
        type: string
      version_id:
        description: Approved GateX report version UUID
        required: true
        type: string
      content_checksum:
        description: SHA-256 of the canonical approved release payload
        required: true
        type: string
      callback_base:
        description: GateX callback origin
        required: true
        default: https://gatex.fund
        type: string

permissions:
  contents: read

concurrency:
  group: gatex-pdf-${{ inputs.item_id }}-${{ inputs.version_id }}
  cancel-in-progress: false

jobs:
  render-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ITEM_ID_INPUT: ${{ inputs.item_id }}
      VERSION_ID_INPUT: ${{ inputs.version_id }}
      CONTENT_CHECKSUM_INPUT: ${{ inputs.content_checksum }}
      CALLBACK_BASE_INPUT: ${{ inputs.callback_base }}
    steps:
      - name: Checkout approved renderer
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Check release bridge syntax
        run: python -m compileall -q gen_rpt tools/gatex_release_bridge.py

      - name: Render, verify and stage approved PDF
        id: release
        env:
          GATEX_GENERATION_CALLBACK_SECRET: ${{ secrets.GATEX_GENERATION_CALLBACK_SECRET }}
          GATEX_GENERATION_CALLBACK_ALLOWED_HOSTS: gatex.fund,www.gatex.fund
        run: |
          set -euo pipefail
          python -u tools/gatex_release_bridge.py run \
            --item-id "$ITEM_ID_INPUT" \
            --version-id "$VERSION_ID_INPUT" \
            --content-checksum "$CONTENT_CHECKSUM_INPUT" \
            --callback-base "$CALLBACK_BASE_INPUT" \
            --out-root output/pdf

      - name: Notify GateX if the release workflow stopped early
        if: ${{ failure() && steps.release.outputs.release_failure_notified != 'true' }}
        env:
          GATEX_GENERATION_CALLBACK_SECRET: ${{ secrets.GATEX_GENERATION_CALLBACK_SECRET }}
          GATEX_GENERATION_CALLBACK_ALLOWED_HOSTS: gatex.fund,www.gatex.fund
        run: |
          python -u tools/gatex_release_bridge.py notify-failure \
            --item-id "$ITEM_ID_INPUT" \
            --version-id "$VERSION_ID_INPUT" \
            --content-checksum "$CONTENT_CHECKSUM_INPUT" \
            --callback-base "$CALLBACK_BASE_INPUT" \
            --message "The approved GateX PDF release workflow stopped before publication." || true
