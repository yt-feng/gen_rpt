name: "[V2] Generate HTML Thought Leadership Report"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: English thought-leadership topic.
        required: false
        default: Nuclear fusion commercialization outlook and strategic implications
        type: string
      slug:
        description: Optional custom output directory slug
        required: false
        default: ""
        type: string
      model:
        description: DeepSeek model name
        required: false
        default: deepseek-chat
        type: string
      rag_required:
        description: Requested private-evidence contract (preserved in result; strict policy fails when unavailable)
        required: false
        default: false
        type: boolean
      content_policy:
        description: Produce a disclosed general overview when private evidence or research quality is unavailable
        required: false
        default: seo_overview
        type: choice
        options: [seo_overview, strict]
      job_id:
        description: Original backend job ID (empty for standalone generation)
        required: false
        default: ""
        type: string
      job_retry_count:
        description: Original backend attempt counter
        required: false
        default: ""
        type: string
      context_state:
        description: Backend context readiness; overview_only never reads stale cached context
        required: false
        default: unknown
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: gen-rpt-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEN_RPT_PER_QUERY: 5
      GEN_RPT_MAX_SOURCES: 32
      GEN_RPT_MAX_QUERIES: 24
      GEN_RPT_GDELT_QUERIES: 2
      GEN_RPT_GDELT_TIMESPAN: 36months
      GEN_RPT_FETCH_TIMEOUT: 18
      GEN_RPT_RAG_WEB_MAX_QUERIES: 4
      GEN_RPT_RAG_WEB_PER_QUERY: 2
      GEN_RPT_RAG_WEB_MAX_SOURCES: 8
      GEN_RPT_RAG_WEB_REQUIRED: false
      MAX_AI_SECTION_IMAGES: 12
      AI_IMAGE_TIMEOUT: 45
      AI_IMAGE_RETRIES: 3
      SHOW_FALLBACK_IMAGES: true
      TOPIC_INPUT: ${{ inputs.topic || '' }}
      SLUG_INPUT: ${{ inputs.slug || '' }}
      MODEL_INPUT: ${{ inputs.model || '' }}
      RAG_REQUIRED: ${{ inputs.rag_required || false }}
      CONTENT_POLICY: ${{ inputs.content_policy || 'seo_overview' }}
      GENERATION_JOB_ID: ${{ inputs.job_id || '' }}
      GENERATION_JOB_RETRY_COUNT: ${{ inputs.job_retry_count || '' }}
      RESULT_PATH: .artifacts/report-generation/result.json
      GENERATION_CONTEXT_STATE: ${{ inputs.context_state || 'unknown' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        id: generate_report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SEARXNG_URL: ${{ vars.SEARXNG_URL || secrets.SEARXNG_URL }}
          SEARXNG_API_KEY: ${{ secrets.SEARXNG_API_KEY }}
        run: |
          set -euo pipefail
          TOPIC="$TOPIC_INPUT"
          SLUG="$SLUG_INPUT"
          MODEL="$MODEL_INPUT"

          if [ -z "$TOPIC" ]; then
            TOPIC="Nuclear fusion commercialization outlook and strategic implications"
          fi
          if [ -z "$MODEL" ]; then
            MODEL="deepseek-chat"
          fi
          if [ -z "$SLUG" ]; then
            SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
            SLUG="auto-smoke-nuclear-fusion-${SHORT_SHA}"
          fi

          mkdir -p .artifacts/report-generation
          GEN_LOG=".artifacts/report-generation/generation-${GITHUB_RUN_ID:-local}.log"
          
          set +e
          python -u -m gen_rpt.main_web \
            --topic "$TOPIC" \
            --slug "$SLUG" \
            --language en \
            --model "$MODEL" \
            --out-root reports_web \
            --content-policy "$CONTENT_POLICY" \
            --result-path "$RESULT_PATH" \
            --checkpoint-path ".artifacts/report-generation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" > "$GEN_LOG" 2>&1
          GEN_STATUS="$?"
          set -e

          echo "::group::Full generator log"
          cat "$GEN_LOG"
          echo "::endgroup::"
          if [ "$GEN_STATUS" -ne 0 ]; then
            ERROR_LINE="$(tail -n 1 "$GEN_LOG" | tr -d '\r')"
            echo "::error title=Generator failure::$ERROR_LINE"
            {
              echo "### Generator failure"
              echo '```text'
              tail -n 40 "$GEN_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Generator failed with exit code $GEN_STATUS" >&2
            exit "$GEN_STATUS"
          fi

          # The generator writes its exact output path and status to GITHUB_OUTPUT.
          # Never select an unrelated old report by directory modification time.
          test -s "$RESULT_PATH"

      - name: Preserve generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-generation-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw drafts, source URLs and RAG inputs remain runner-local.
          path: .artifacts/report-generation/*.diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated report back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain reports_web)" ]; then
            git add reports_web
            if [ -d "review_outputs" ]; then git add review_outputs; fi
            git commit -m "Add generated HTML thought leadership report"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No report changes to commit"
          fi

      - name: Check R2 secrets
        id: check_r2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "has_r2_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_r2_secrets=false" >> "$GITHUB_OUTPUT"
            if [ -n "$GENERATION_JOB_ID" ]; then
              echo "Backend job output requires configured R2 storage" >&2
              exit 1
            fi
          fi

      - name: Install R2 storage dependencies
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        run: |
          pip install -r storage/requirements.txt

      - name: Upload report to R2
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          STORAGE_LOG_DIR:      /tmp/storage-logs
        run: |
          set -euo pipefail
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          # Call the new stateless storage uploader or the backend API for upload URLs in future
          # For Phase 5, we assume the upload_report handles pure artifact uploads
          python -m storage.upload_report \
            --report-dir "$REPORT_DIR" \
            --status generated \
            --log-level INFO \
            --skip-catalog-update
          python tools/notify_generation_result.py --verify-upload-only --receipt "$RESULT_PATH"

      - name: Trigger Backend Workflow Event
        if: steps.check_r2.outputs.has_r2_secrets == 'true'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python tools/notify_generation_result.py --receipt "$RESULT_PATH"

      - name: Preserve structured generation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-generation-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/report-generation/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Trigger AI Review Workflow
        # Overview is a disclosed different deliverable, not a failed research review.
        if: steps.generate_report.outputs.status == 'generated' && inputs.content_policy == 'strict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering AI Review workflow..."
          REPORT_DIR="${{ steps.generate_report.outputs.report_dir }}"
          REPORT_ID="$(basename "$REPORT_DIR")"
          gh workflow run generate_review_v2.yml -f report_id="$REPORT_ID"

      - name: Report generation failure to backend
        if: failure()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: python tools/notify_generation_result.py --failure --slug "$SLUG_INPUT"
