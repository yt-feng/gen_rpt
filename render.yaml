services:
  - type: web
    name: report-management-backend
    runtime: python
    rootDir: report-management-backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false     # must be set manually in Render dashboard
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        value: "db90aed966f6c6a6aa46e09332ca11350a3ee2ee85e7e5efbab53a92a43fa3be"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://gen-rpt-review-frontend.pages.dev"
      # AI APIs — set values in Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      # Internal worker auth
      - key: INTERNAL_TOKEN
        sync: false
      - key: BACKEND_URL
        value: https://report-backend-api.onrender.com
      # GitHub integration
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: yt-feng/gen_rpt
      # RAG / Knowledge feature flags
      - key: KNOWLEDGE_ENABLED
        value: "true"
      - key: RAG_ENABLED
        value: "true"
      - key: UPLOAD_ENABLED
        value: "true"
      - key: PROCESSING_ENABLED
        value: "true"
      - key: RETRIEVAL_ENABLED
        value: "true"
      - key: VALIDATION_ENABLED
        value: "true"
      - key: SEARCH_ENABLED
        value: "true"

